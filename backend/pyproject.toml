[project]
# Metadata only exists so Vercel's Python builder (uv) has a [project] table
# to lock against — see the "landing page" deploy failure, 2026-08-09:
# "error: No `project` table found in: backend/pyproject.toml". No
# [build-system] table on purpose: uv (>=0.4) then treats this as deps-only
# and never tries to build/install the backend itself as a package.
# `dependencies` mirrors requirements.txt (the source of truth for
# Render/local dev) because Vercel's builder reads pyproject.toml exclusively
# once it exists, ignoring requirements.txt — keep the two in sync by hand.
name = "fincontext-backend"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = [
    # fastapi/uvicorn/pydantic were exact-pinned until 2026-08-11, when
    # adding crewai broke dependency resolution here too: crewai 1.15.14
    # requires pydantic>=2.11.9,<2.13 and its `mcp` dep pulls a starlette/
    # uvicorn newer than fastapi 0.109.2 supports — see requirements.txt for
    # the full incident writeup, keep both files in sync.
    "fastapi>=0.109.2",
    "uvicorn[standard]>=0.27.1",
    "pydantic[email]>=2.11.9,<2.13",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.36",
    "feedparser>=6.0.0",
    "cachetools>=5.3.0",
    "pandas>=2.0.0,<3",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0,<3",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.30.0,<0.31",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "google-generativeai>=0.4.0",
    "groq>=0.11.0",
    "openai>=1.50.0",
    "supabase>=2.0.0",
    "kiteconnect>=5.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "langfuse>=3.0.0",
    # ---------------------------------------------------------------------
    # crewai is DELIBERATELY ABSENT from this file. Do not "fix the drift" by
    # adding it back — that is what broke every Vercel production deploy from
    # 8ec848f (2026-08-11) onward.
    #
    # Vercel reads THIS file exclusively (uv builder) and bundles the result
    # into a Python function with a hard 500 MB ceiling. crewai core's tree
    # drags in its RAG/memory stack — lancedb (~149 MB), googleapiclient
    # (~103 MB), pyarrow (~85 MB), chromadb_rust_bindings (~57 MB),
    # onnxruntime (~40 MB), kubernetes (~40 MB) — none of which these crews
    # touch (plain sequential Agent/Task chains, no memory, no knowledge
    # sources). Measured bundle with crewai: ~1058 MB. The limit is a platform
    # limit; there is no excludeFiles trick that strips installed
    # site-packages.
    #
    # crewai STAYS in requirements.txt, which is what Render installs — so the
    # agent surfaces run fully there. On Vercel the crewai imports in
    # agents/base.py / registry.py / crews/ are all lazy and inside
    # try/except, and prewarm() swallows its own failures, so the agent
    # endpoints degrade to the legacy ai_client path instead of erroring.
    # That is exactly the state the last GREEN Vercel deploy (e61f5de) ran in.
    #
    # If you need real agents on Vercel, the fix is architectural, not a pin:
    # drop `experimentalServices.backend` from vercel.json and serve the API
    # from Render only. See AGENTS.md.
    # ---------------------------------------------------------------------
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["venv", ".venv", "__pycache__"]

[tool.ruff.lint]
# Kept deliberately small — this codebase leans on broad `except Exception`
# for graceful degradation (yfinance/Supabase/LLM calls all fail open by
# design, see grounding.py / vector_store.py / outcome_ledger.py). Don't
# enable blanket-except or unused-import-in-__init__ rules without checking
# that pattern first.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter/line-length above, not worth failing CI over in data-heavy dict literals
]

[tool.ruff.lint.per-file-ignores]
"app/agents/*" = ["F401"]  # crewai/CrewAI types are imported lazily inside functions on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_llm: hits a real LLM provider — costs money, needs an API key, skipped by default in CI without secrets",
]
