name: CI

# Backend: lint (ruff) + tests. Deterministic evals in tests/evals/ always
# run; live grounding evals in test_grounding_live.py auto-skip unless
# GROQ_API_KEY (or OPENAI_API_KEY) is set as a repo secret — add one if you
# want the real hallucination checks to run in CI, not just locally.
#
# Frontend: eslint only for now. `next build` needs NEXT_PUBLIC_SUPABASE_*
# at build time; add those as repo secrets and extend the frontend job with
# a build step once that's set up, rather than letting a missing-secret
# build failure block unrelated PRs.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest tests/ -q
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # continue-on-error: there are ~33 pre-existing lint errors across the
      # codebase (react-hooks/set-state-in-effect, unescaped entities) that
      # predate this workflow. Flip this to blocking once those are cleared
      # — see the AI-native-builder review notes — otherwise every PR goes
      # red for unrelated reasons.
      - run: npm run lint
        continue-on-error: true
